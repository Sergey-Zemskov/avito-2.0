{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}

<h2>Регистрация</h2>

<form method="POST" action="{{ url_for('register') }}" style="border: 1px solid black; padding: 10px; background: #fafafa;">
    <p>Логин (не короче 3 символов):<br><input type="text" name="login" minlength="3" maxlength="50" required></p>
    <p>Пароль (не короче 6 символов):<br><input type="password" name="password" minlength="6" required></p>
    <input type="submit" value="Зарегистрироваться">
</form>

<p>Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>

{% endblock %}

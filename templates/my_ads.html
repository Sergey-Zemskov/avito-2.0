{% extends "base.html" %}

{% block title %}Мои объявления{% endblock %}

{% block content %}

<h2>Мои объявления</h2>

<table border="1" width="100%" cellpadding="5">
    <tr style="background: #e0e0e0;">
        <th>Название</th>
        <th>Цена</th>
        <th>Действия</th>
    </tr>
    {% for ad in ads %}
    <tr>
        <td><a href="{{ url_for('ad_detail', ad_id=ad[0]) }}">{{ ad[1] }}</a></td>
        <td>{{ ad[2] }} руб.</td>
        <td>
            <a href="{{ url_for('ad_edit', ad_id=ad[0]) }}">Изменить</a>
            <form action="{{ url_for('ad_delete', ad_id=ad[0]) }}" method="POST" style="display: inline;">
                <input type="submit" value="Удалить">
            </form>
        </td>
    </tr>
    {% else %}
    <tr>
        <td colspan="3" align="center">У вас нет объявлений.</td>
    </tr>
    {% endfor %}
</table>

<p><a href="{{ url_for('ad_create') }}">+ Подать объявление</a></p>

{% endblock %}

{% extends "base.html" %}{% block title %}Мои объявления{% endblock %}{% block content %}<h1 class="page-title">Мои объявления</h1><div class="table-wrap"><table><tr><th>Название</th><th>Цена</th><th>Действия</th></tr>{% for ad in ads %}<tr><td><a href="{{ url_for('ad_detail', ad_id=ad[0]) }}">{{ ad[1] }}</a></td><td>{{ ad[2] }} ₽</td><td><a href="{{ url_for('ad_edit', ad_id=ad[0]) }}">Редактировать</a><form action="{{ url_for('ad_delete', ad_id=ad[0]) }}" method="POST" style="display:inline"><button class="secondary">Удалить</button></form></td></tr>{% else %}<tr><td colspan="3">Объявлений пока нет.</td></tr>{% endfor %}</table></div>{% endblock %}

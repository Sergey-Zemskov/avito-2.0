{% extends "base.html" %}
{% block content %}
<h2>Мои объявления</h2>
<table>
    <tr><th>Название</th><th>Цена</th><th>Действия</th></tr>
    {% for ad in ads %}
    <tr>
        <td><a href="{{ url_for('ad_detail', ad_id=ad[0]) }}">{{ ad[1] }}</a></td>
        <td>{{ ad[2] }} р.</td>
        <td>
            <a href="{{ url_for('edit_ad', ad_id=ad[0]) }}">Редактировать</a>
            <form action="{{ url_for('delete_ad_route', ad_id=ad[0]) }}" method="POST" style="display:inline;">
                <button type="submit">Удалить</button>
            </form>
        </td>
    </tr>
    {% else %}<tr><td colspan="3">У вас нет объявлений.</td></tr>{% endfor %}
</table>
{% endblock %}

{% extends "base.html" %}

{% block title %}Сообщения{% endblock %}

{% block content %}

<h1>Мои переписки</h1>

{% if users %}
<table class="list">
    <tr>
        <th>Пользователь</th>
    </tr>
    {% for u in users %}
    <tr>
        <td><a href="/messages/{{ u.id }}">{{ u.login }}</a></td>
    </tr>
    {% endfor %}
</table>
{% else %}
<div class="empty">
    Сообщений пока нет.
</div>
{% endif %}

{% endblock %}

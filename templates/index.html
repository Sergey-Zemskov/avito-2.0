{% extends "base.html" %}
{% block content %}
<h2>Все объявления</h2>
<form method="GET" action="/" class="search-form">
    <input type="text" name="q" placeholder="Название" value="{{ q }}">
    <input type="text" name="city" placeholder="Город" value="{{ city }}">
    <select name="category">
        <option value="">Все категории</option>
        {% for c in categories %}
            <option value="{{ c[0] }}" {% if selected_cat == c[0]|string %}selected{% endif %}>{{ c[1] }}</option>
        {% endfor %}
    </select>
    <select name="sort">
        <option value="date" {% if sort=='date' %}selected{% endif %}>Сначала новые</option>
        <option value="price" {% if sort=='price' %}selected{% endif %}>По цене</option>
    </select>
    <button type="submit">Искать</button>
</form>

<table>
    <tr><th>Фото</th><th>Название</th><th>Цена</th><th>Город</th><th>Продавец</th></tr>
    {% for ad in ads %}
    <tr>
        <td><img src="{{ url_for('image', ad_id=ad[0]) }}" width="60" alt=""></td>
        <td><a href="{{ url_for('ad_detail', ad_id=ad[0]) }}">{{ ad[1] }}</a></td>
        <td>{{ ad[2] }} р.</td>
        <td>{{ ad[3] }}</td>
        <td>{{ ad[5] }}</td>
    </tr>
    {% else %}
    <tr><td colspan="5">Объявлений нет.</td></tr>
    {% endfor %}
</table>
{% endblock %}

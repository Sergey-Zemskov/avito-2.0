{% extends "base.html" %}

{% block content %}

<h2>Все объявления</h2>

<form method="GET" action="/" class="search-form">

    <input
        type="text"
        name="q"
        placeholder="Название"
        value="{{ search_query }}"
    >

    <input
        type="text"
        name="city"
        placeholder="Город"
        value="{{ selected_city }}"
    >

    <select name="category_id">

        <option value="">Все категории</option>

        {% for c in categories %}

            <option
                value="{{ c[0] }}"
                {% if selected_category == c[0]|string %}selected{% endif %}
            >
                {{ c[1] }}
            </option>

        {% endfor %}

    </select>

    <select name="sort">

        <option
            value="date"
            {% if sort_by == "date" %}selected{% endif %}
        >
            Сначала новые
        </option>

        <option
            value="price_asc"
            {% if sort_by == "price_asc" %}selected{% endif %}
        >
            Сначала дешёвые
        </option>

        <option
            value="price_desc"
            {% if sort_by == "price_desc" %}selected{% endif %}
        >
            Сначала дорогие
        </option>

    </select>

    <button type="submit">Искать</button>

</form>

<table>

    <tr>
        <th>Название</th>
        <th>Цена</th>
        <th>Город</th>
        <th>Продавец</th>
    </tr>

    {% for ad in ads %}

    <tr>

        <td>
            <a href="{{ url_for('ad_detail', ad_id=ad[0]) }}">
                {{ ad[1] }}
            </a>
        </td>

        <td>{{ ad[2] }} р.</td>

        <td>{{ ad[3] }}</td>

        <td>{{ ad[6] }}</td>

    </tr>

    {% else %}

    <tr>
        <td colspan="4">Объявлений нет.</td>
    </tr>

    {% endfor %}

</table>

{% endblock %}

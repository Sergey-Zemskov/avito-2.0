{% extends "base.html" %}
{% block content %}
<h2>Диалоги</h2>
<ul>
    {% for c in chats %}
    <li><a href="{{ url_for('chat', ad_id=c[0], other_id=c[1]) }}">Объявление #{{ c[0] }} (собеседник: {{ c[1] }})</a></li>
    {% else %}
    <li>У вас нет сообщений.</li>
    {% endfor %}
</ul>
{% endblock %}


{% extends "base.html" %}

{% block title %}Сообщения{% endblock %}

{% block content %}
<h2>Мои переписки</h2>

{% for conversation in conversations %}
    <article class="conversation">
        <h3>
            <a href="{{ url_for('chat', other_id=conversation[0]) }}">
                {{ conversation[1] }}
            </a>
        </h3>

        <p>Последнее сообщение: {{ conversation[2] }}</p>
    </article>
{% else %}
    <p>У вас пока нет переписок.</p>
{% endfor %}
{% endblock %}

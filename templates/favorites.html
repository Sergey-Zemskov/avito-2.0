{% extends "base.html" %}
{% block content %}
<h2>Избранное</h2>
<table>
    <tr><th>Название</th><th>Цена</th><th>Действия</th></tr>
    {% for ad in ads %}
    <tr>
        <td><a href="{{ url_for('ad_detail', ad_id=ad[0]) }}">{{ ad[1] }}</a></td>
        <td>{{ ad[2] }} р.</td>
        <td>
            <form action="{{ url_for('fav_remove', ad_id=ad[0]) }}" method="POST">
                <button type="submit">Убрать</button>
            </form>
        </td>
    </tr>
    {% else %}<tr><td colspan="3">В избранном пусто.</td></tr>{% endfor %}
</table>
{% endblock %}

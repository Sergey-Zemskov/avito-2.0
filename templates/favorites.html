{% extends "base.html" %}{% block title %}Избранное{% endblock %}{% block content %}<h1 class="page-title">Избранное</h1>{% if ads %}<div class="ad-grid">{% for ad in ads %}<article class="ad-card"><a class="ad-photo" href="{{ url_for('ad_detail', ad_id=ad[0]) }}">{% if ad[4] %}<img src="{{ url_for('image', ad_id=ad[0]) }}" alt="Фото">{% else %}<span>Фото</span>{% endif %}</a><div class="ad-info"><a class="ad-title" href="{{ url_for('ad_detail', ad_id=ad[0]) }}">{{ ad[1] }}</a><div class="ad-price">{{ ad[2] }} ₽</div><div class="ad-meta">{{ ad[3] }}</div><form method="POST" action="{{ url_for('favorite_toggle', ad_id=ad[0]) }}"><input type="hidden" name="next" value="{{ url_for('favorites') }}"><button class="secondary">Убрать</button></form></div></article>{% endfor %}</div>{% else %}<div class="panel">Пока ничего не добавлено в избранное.</div>{% endif %}{% endblock %}
